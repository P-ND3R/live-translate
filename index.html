<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Talk Translate</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:#111827;color:#f9fafb;height:100dvh;display:flex;flex-direction:column}
  header{padding:12px 16px;display:flex;gap:8px;align-items:center}
  select,input,button{font-size:18px;border-radius:12px;border:0;padding:12px}
  select,input{background:#1f2937;color:#f9fafb}
  button{background:#2563eb;color:#fff;font-weight:600}
  #setup{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:16px}
  #room{display:none;text-align:center;font-size:15px;opacity:.8}
  #room b{font-size:22px;letter-spacing:4px}
  #chat{flex:1;overflow-y:auto;padding:16px;display:none;flex-direction:column;gap:10px}
  .msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:18px}
  .me{align-self:flex-end;background:#2563eb}
  .them{align-self:flex-start;background:#374151}
  .orig{font-size:13px;opacity:.7;margin-top:4px}
  #controls{display:none;flex-direction:column;gap:8px;padding:0 16px 16px}
  #talk{height:110px;border-radius:55px;font-size:22px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #talk.on{background:#dc2626}
  #typeRow{display:flex;gap:8px}
  #typeRow input{flex:1;min-width:0}
  #status{padding:4px 16px;opacity:.75;font-size:14px;text-align:center;min-height:1.4em}
  #live{padding:0 16px;font-style:italic;opacity:.6;text-align:center;min-height:1.2em}
</style>
</head>
<body>
<header>
  <label for="lang">I speak</label>
  <select id="lang" style="flex:1">
    <option value="en-US">English</option><option value="es-ES">Español</option>
    <option value="fr-FR">Français</option><option value="de-DE">Deutsch</option>
    <option value="it-IT">Italiano</option><option value="pt-BR">Português</option>
    <option value="zh-CN">中文</option><option value="ja-JP">日本語</option>
    <option value="ko-KR">한국어</option><option value="ar-SA">العربية</option>
    <option value="hi-IN">हिन्दी</option><option value="ru-RU">Русский</option>
    <option value="vi-VN">Tiếng Việt</option><option value="tl-PH">Tagalog</option>
  </select>
</header>

<div id="setup">
  <button id="host">Start a conversation</button>
  <div style="text-align:center;opacity:.6">— or —</div>
  <input id="join" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit code">
  <button id="joinBtn">Join</button>
</div>

<div id="room">Room code <b id="code"></b></div>
<div id="chat"></div>
<div id="live"></div>
<div id="status"></div>
<div id="controls">
  <select id="mode">
    <option value="free">Hands-free</option>
    <option value="push">Push to talk</option>
  </select>
  <button id="talk">Tap to start listening</button>
  <div id="typeRow">
    <input id="typed" placeholder="…or type a message" enterkeyhint="send">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const lang = () => $('lang').value;
const me = Math.random().toString(36).slice(2);
const RELAY = 'https://ntfy.sh/';
let topic, events, greeted = false;

function status(t){ $('status').textContent = t; }

// Messages go through the ntfy.sh relay, which works on any network (no direct phone-to-phone link)
function enterRoom(code){
  topic = 'talktranslate-v2-' + code;
  $('setup').style.display = 'none';
  $('room').style.display = 'block';
  $('code').textContent = code;
  $('chat').style.display = 'flex';
  $('controls').style.display = 'flex';
  status('Waiting for the other person to join…');
  listen();
  send({ type: 'hello' });
}

function listen(){
  events = new EventSource(RELAY + topic + '/sse');
  events.onmessage = e => {
    let m;
    try { m = JSON.parse(JSON.parse(e.data).message); } catch { return; }
    if (!m || m.from === me) return;
    if (m.type === 'hello'){
      status('Connected');
      if (!greeted){ greeted = true; send({ type: 'hello' }); }
    } else if (m.type === 'text'){
      status('Connected');
      receive(m);
    }
  };
  events.onerror = () => status('Reconnecting…');
}

function send(m){
  m.from = me;
  return fetch(RELAY + topic, { method: 'POST', body: JSON.stringify(m) })
    .catch(() => status('Could not send — check your internet'));
}

async function receive(m){
  const text = await translate(m.text, m.lang, lang());
  add(text, 'them', m.text);
  say(text);
}

function share(text){
  text = text.trim();
  if (!text) return;
  add(text, 'me');
  send({ type: 'text', text, lang: lang() });
}

$('host').onclick = () => enterRoom(String(Math.floor(100000 + Math.random() * 900000)));
$('joinBtn').onclick = () => {
  const code = $('join').value.trim();
  if (!/^\d{6}$/.test(code)) return status('Enter the 6-digit code');
  enterRoom(code);
};
$('sendBtn').onclick = () => { share($('typed').value); $('typed').value = ''; };
$('typed').onkeydown = e => { if (e.key === 'Enter') $('sendBtn').click(); };

async function translate(text, from, to){
  const f = from.split('-')[0], t = to.split('-')[0];
  if (f === t) return text;
  try {
    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${f}|${t}`);
    const j = await r.json();
    return j.responseData.translatedText || text;
  } catch { return text; }
}

function add(text, who, orig){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.textContent = text;
  if (orig && orig !== text){
    const o = document.createElement('div');
    o.className = 'orig'; o.textContent = orig; div.appendChild(o);
  }
  $('chat').appendChild(div);
  $('chat').scrollTop = 1e9;
}

// Speech recognition. Android Chrome is unreliable with continuous mode, so hands-free
// listens one phrase at a time and restarts after each one.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const handsFree = () => $('mode').value === 'free';
let rec, wantMic = false, speaking = false;

function startRec(){
  if (!SR) return status('Voice not supported in this browser — use Chrome, or type below');
  if (rec || speaking) return;
  let pending = '', sent = false;
  const r = rec = new SR();
  r.lang = lang();
  r.continuous = false;
  r.interimResults = true;
  r.onstart = () => status('Listening…');
  r.onspeechstart = () => status('Hearing you…');
  r.onresult = ev => {
    let interim = '';
    for (let i = ev.resultIndex; i < ev.results.length; i++){
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal){ sent = true; pending = ''; share(t); }
      else interim += t;
    }
    pending = interim;
    $('live').textContent = interim;
  };
  r.onerror = ev => {
    if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed'){
      wantMic = false; updateButton();
      status('Microphone blocked — allow it in Chrome site settings');
    } else if (ev.error !== 'no-speech' && ev.error !== 'aborted'){
      status('Mic problem: ' + ev.error);
    }
  };
  r.onend = () => {
    // Some phones end without marking the last words final; send what was heard
    if (!sent && pending) share(pending);
    $('live').textContent = '';
    if (rec === r) rec = null;
    if (wantMic && handsFree()) setTimeout(startRec, 250);
    else if (!speaking) status('Mic off');
  };
  try { r.start(); }
  catch { rec = null; if (wantMic) setTimeout(startRec, 500); }
}
function stopRec(){ const r = rec; rec = null; if (r){ try { r.abort(); } catch {} } }

function updateButton(){
  $('talk').classList.toggle('on', wantMic);
  $('talk').textContent = handsFree()
    ? (wantMic ? 'Listening — tap to stop' : 'Tap to start listening')
    : (wantMic ? 'Listening…' : 'Hold to talk');
}

$('talk').addEventListener('pointerdown', e => {
  e.preventDefault();
  if (handsFree()){
    wantMic = !wantMic;
    wantMic ? startRec() : stopRec();
  } else {
    wantMic = true; startRec();
  }
  updateButton();
});
// Releasing in push-to-talk lets recognition finish so the last words still get sent
const release = () => { if (!handsFree() && wantMic){ wantMic = false; rec && rec.stop(); updateButton(); } };
$('talk').addEventListener('pointerup', release);
$('talk').addEventListener('pointercancel', release);
$('talk').addEventListener('contextmenu', e => e.preventDefault());
$('mode').onchange = () => { wantMic = false; stopRec(); updateButton(); };
updateButton();

// Pause the mic while reading a translation aloud so it doesn't hear itself
let utterance;
function say(text){
  speaking = true; stopRec();
  const done = () => {
    if (!speaking) return;
    speaking = false;
    if (wantMic && handsFree()) startRec();
  };
  utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang();
  utterance.onend = utterance.onerror = done;
  speechSynthesis.speak(utterance);
  // Android sometimes never fires onend
  setTimeout(done, 2000 + text.length * 90);
}
</script>
</body>
</html>
